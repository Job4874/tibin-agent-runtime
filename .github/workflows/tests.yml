name: Tests

on:
  push:
    branches: ["main", "public-release", "cursor/**"]
  pull_request:
    branches: ["main"]

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt pytest

      - name: Create required runtime directories
        run: |
          mkdir -p logs screenshots

      - name: Copy env example
        run: |
          cp config/env.example .env

      - name: Run tests
        run: |
          python -m pytest -q --tb=short
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
