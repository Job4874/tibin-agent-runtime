{% extends "base.html" %}
{% block page_title %}429 Too Many Requests{% endblock %}
{% block content %}
<div class="flex flex-col items-center justify-center" style="min-height: 60vh; gap: 1.5rem; text-align: center;">
    <span class="material-icons-round" style="font-size: 4rem; color: var(--warning);">speed</span>
    <div>
        <h1 style="font-size: 3rem; font-weight: 700; color: var(--warning); font-family: 'JetBrains Mono', monospace;">429</h1>
        <p style="font-size: 1.125rem; color: var(--text-secondary); margin-top: 0.5rem;">Too many requests</p>
        <p style="font-size: 0.875rem; color: var(--text-muted); margin-top: 0.5rem;">You have exceeded the request rate limit. Please wait a moment and try again.</p>
    </div>
    <a href="/dashboard" class="btn btn-primary">
        <span class="material-icons-round icon-base">home</span> Back to Dashboard
    </a>
</div>
{% endblock %}
