{% extends "base.html" %}
{% block page_title %}404 Not Found{% endblock %}
{% block content %}
<div class="flex flex-col items-center justify-center" style="min-height: 60vh; gap: 1.5rem; text-align: center;">
    <span class="material-icons-round" style="font-size: 4rem; color: var(--text-muted);">search_off</span>
    <div>
        <h1 style="font-size: 3rem; font-weight: 700; color: var(--text-primary); font-family: 'JetBrains Mono', monospace;">404</h1>
        <p style="font-size: 1.125rem; color: var(--text-secondary); margin-top: 0.5rem;">Page not found</p>
        <p style="font-size: 0.875rem; color: var(--text-muted); margin-top: 0.5rem;">The resource you requested does not exist on this server.</p>
    </div>
    <a href="/dashboard" class="btn btn-primary">
        <span class="material-icons-round icon-base">home</span> Back to Dashboard
    </a>
</div>
{% endblock %}
